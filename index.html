<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-vr-kit@v0.2.0/vr-kit.js"></script>
    <style>
        #hud{
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 999;
            padding: 12px;
        }

        select{
            font-size: 18px;
            padding: 4px 8px;
            width: 200px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <select name="" id="avatarChoice">
            <option value="robot.glb">ロボット</option>
            <option value="wolf.glb">狼</option>
        </select>
    </div>
    <a-scene>
    <a-sky color="skyblue"></a-sky>
    <a-plane
        rotation="-90 0 0"
        width="30"
        height="30"
        color="forestgreen"
    ></a-plane>
    <a-entity
        id="avatar"
        gltf-model="robot.glb"
        position="0 0 -3"
        scale="0.3 0.3 0.3"
        avatar="
        view:third;
        avatarDirection:180;
        walk: Robot_Walking;
        idle: Robot_Dance;
        "></a-entity>

        <a-box color="gold" position="0 0 -5"></a-box>        
        <a-box color="blue" position="3  0 -10"></a-box>        
        <a-box color="white" position="2 0 0"></a-box>

    </a-scene>
    <script>
        const avatar = document.getElementById("avatar");
        const avatarChoice = document.getElementById("avatarChoice");

        function changeAvatar(){
            if(avatarChoice.value === "wolf.glb"){
                avatar.setAttribute("gltf-model",avatarChoice.value);
                avatar.setAttribute("scale","0.35 0.35 0.35");
                avatar.setAttribute(
                    "avatar-motion",{
                        walk: "Gallop",
                        idle: "AnimalArmature|Idle_2"
                    }
                );
            }else if(avatarChoice.value === "robot.glb"){
                avatar.setAttribute("gltf-model",avatarChoice.value);
                avatar.setAttribute("scale","0.3 0.3 0.3");
                avatar.setAttribute(
                    "avatar-motion",{
                        walk: "Robot_Walking",
                        idle: "Robot_Dance"
                    }
                );
            }
            
        }
        avatarChoice.addEventListener("change",changeAvatar);
    </script>
</body>
</html>
